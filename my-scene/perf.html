<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>性能对比实验 · antialias与物体数量</title>
  <style>
    body { font-family: "Microsoft YaHei", sans-serif; margin: 20px; background: #0f1420; color: #dce7f5; }
    h2 { margin: 0 0 8px; }
    p { line-height: 1.7; color: #9fb3cc; max-width: 900px; }
    #stage { width: 800px; height: 500px; border: 1px solid #34465e; margin: 12px 0; }
    button { padding: 8px 18px; margin-right: 10px; font-size: 14px; cursor: pointer; }
    table { border-collapse: collapse; margin-top: 14px; }
    th, td { border: 1px solid #34465e; padding: 8px 16px; text-align: center; }
    th { background: #1c2839; }
    #status { color: #ffcc33; margin-top: 10px; }
  </style>
</head>
<body>
  <h2>选做研究3：性能对比实验</h2>
  <p>
    实验变量：① 物体数量（100 / 3000 个立方体）；② 抗锯齿 antialias（开 / 关）。
    每组运行 4 秒，统计平均帧率 FPS 与绘制调用次数 draw calls。
    场景为 3000 个独立 Mesh（每个独立提交绘制），用于放大数量差异。
  </p>
  <button id="run-all">运行全部对比（约12秒）</button>
  <div id="status">尚未运行</div>
  <div id="stage"></div>
  <table>
    <thead>
      <tr><th>组别</th><th>物体数量</th><th>antialias</th><th>平均FPS</th><th>draw calls</th></tr>
    </thead>
    <tbody id="result"></tbody>
  </table>
  <p id="conclusion"></p>
  <script src="../libs/three.min.js"></script>
  <script src="perf.js"></script>
</body>
</html>
